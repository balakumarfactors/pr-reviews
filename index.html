<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>PR reviews</title>
<style>
:root { --bg:#faf9f6; --ink:#1b1d22; --ink-2:#4b505c; --accent:#2748c4; --line:#e2ded4; }
@media (prefers-color-scheme: dark) { :root { --bg:#101319; --ink:#eef1f6; --ink-2:#aab2c0; --accent:#8fb0ff; --line:#2a3140; } }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
main { max-width:640px; margin:0 auto; padding:48px 20px; }
h1 { font-size:1.6rem; margin:0 0 6px; }
p { color:var(--ink-2); margin:0 0 20px; }
a { color:var(--accent); font-weight:600; }
li { margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--line); }
ul { list-style:none; padding:0; margin:0; }
</style>
</head>
<body>
<main>
<h1>PR reviews</h1>
<p>Short guides that help a reviewer understand a pull request before reading the diff.</p>
<ul>
  <li><a href="29705-scout-agents-v0/">Scout Agents V0 (PR #29705)</a></li>
</ul>
</main>
</body>
</html>
